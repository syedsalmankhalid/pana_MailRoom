[project]
name = "pana-mailroom"
version = "0.1.0"
description = "MailRoom: a learning project for Programming Fundamentals (Agent Factory, Chapter 13) using PRIMM-AI+"
readme = "README.md"
authors = [
    { name = "syedsalmankhalid", email = "syedsalmankhalid@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pana-mailroom = "pana_mailroom:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonVersion = "3.14"
